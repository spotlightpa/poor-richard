content = """
Annie McCain is the Executive Vice President of The Lenfest Institute for Journalism, leading advancement, Board development, editorial and communications, external affairs, and various special projects.

Prior to joining the Institute in 2017, she held similar roles at United Way of Greater Philadelphia and Southern New Jersey, The Philadelphia Orchestra, and The Cleveland Orchestra. A native New Yorker, Annie began her fundraising career at Lincoln Center for the Performing Arts and Carnegie Hall.

Annie graduated from Wellesley College with a B.A in Art History and had a small business exhibiting emerging artists in a nonprofit theater when she was working in New York City. She now lives in Wayne, Pennsylvania and serves on the Boards of Jacob’s Pillow and Spotlight PA. While she no longer puts together art shows, she still enjoys museums and dance, theater and music performances, traveling, and most of all spending time with her two sons, who are a source of immense joy and fill the house with great music, baked goods, lots of debate, and many laughs.
"""
