content = """
Mahon reports on addiction treatment, the opioid epidemic, social service programs, and other public health issues in Pennsylvania. His investigations examine what happens when government agencies and policies fail the people they’re supposed to help.

Before joining Spotlight PA, Mahon worked in newsrooms across Pennsylvania —  in the Philadelphia suburbs, State College, York, and Harrisburg. His reporting has spurred policy changes, created new legal precedent in favor of transparency, prompted academic research in peer-reviewed journals, and earned statewide and national recognition. In 2025, Mahon received the Neil and Susan Sheehan Award for Investigative Journalism from the National Press Club Journalism Institute. He is a former president of the Pennsylvania Legislative Correspondents’ Association.

