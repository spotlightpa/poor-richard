<div
  class="w-full rounded-sm border border-g-7 bg-beige p-5 md:max-w-75"
  x-data="gameLeaderboard('{{ .series }}')"
  data-ga-category="game-leaderboard"
>
  <h3
    class="mb-0.5 border-b-2 border-black pb-2 font-serif text-xl font-bold tracking-tight italic"
  >
    {{ .heading | default "Today's Top Scorers" }}
  </h3>
  {{ with .kicker }}
    <div
      class="mt-3 mb-2 font-sans text-xs font-bold tracking-widest text-g-7 uppercase"
    >
      {{ . }}
    </div>
  {{ end }}
  <div class="divide-y divide-g-3">
    <template x-for="row in rows" :key="row.rank">
      <div class="flex items-baseline gap-2.5 py-1.5 font-sans text-sm">
        <span class="w-4 font-bold text-g-7" x-text="row.rank"></span>
        <span class="flex-1 font-bold text-g-9" x-text="row.name"></span>
        <span class="text-g-9 tabular-nums" x-text="row.score"></span>
      </div>
    </template>
    <template x-if="!loading && !rows.length">
      <div class="py-1.5 font-sans text-sm text-g-7">
        Be the first to finish today!
      </div>
    </template>
  </div>
  <div class="mt-3 font-sans text-xs text-g-7">Resets daily at midnight.</div>
</div>
