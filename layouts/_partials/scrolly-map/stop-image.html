{{ $src := .src }}
{{ $parts := split .ratio ":" }}
{{ $widthRatio := 3 }}
{{ $heightRatio := 2 }}
{{ if eq (len $parts) 2 }}
  {{ $widthRatio = index $parts 0 | int }}
  {{ $heightRatio = index $parts 1 | int }}
{{ end }}
{{ $isRemote := or (hasPrefix $src "http://") (hasPrefix $src "https://") }}


<figure data-ga-category="scrolly-map:image">
  <div
    class="aspect-[{{ $widthRatio }}/{{ $heightRatio }}] relative w-full overflow-hidden rounded-sm bg-g-3"
  >
    {{ if $isRemote }}
      <img
        class="h-full w-full object-cover"
        alt="{{ .description }}"
        src="{{ $src }}"
        loading="lazy"
      />
    {{ else }}
      {{ $sizes := dict
        "widths" (slice 400 600 800 1100)
        "widthRatio" $widthRatio
        "heightRatio" $heightRatio
        | partial "helper/build-sizes"
      }}
      {{ $srcset := dict "filename" $src "sizes" $sizes | partial "helper/build-srcset" }}
      {{ $fallbackSize := index $sizes 1 }}
      {{ $fallback := partial "helper/imgproxy" (dict
        "filename" $src
        "width" $fallbackSize.width
        "height" $fallbackSize.height
        "resize" "fill"
        "ext" "jpeg"
        )
      }}
      <picture>
        <source
          type="image/webp"
          srcset="{{ $srcset }}"
          sizes="(min-width: 768px) 24rem, calc(100vw - 2rem)"
        />
        <img
          class="h-full w-full object-cover"
          alt="{{ .description }}"
          src="{{ $fallback }}"
          loading="lazy"
          width="{{ $widthRatio }}"
          height="{{ $heightRatio }}"
        />
      </picture>
    {{ end }}
  </div>
  {{ if or .caption .credit }}
    <figcaption class="mt-2 font-sans text-xs leading-snug text-g-7">
      {{ with .caption }}<span>{{ . }}</span>{{ end }}
      {{ with .credit }}<span class="text-g-6">({{ . }})</span>{{ end }}
    </figcaption>
  {{ end }}
</figure>
